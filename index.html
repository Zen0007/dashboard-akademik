<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- ICON TAB -->
    <link rel="icon" type="image/png" href="src/assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Akademik Dosen</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <header>
        <div class="header-inner">
          <!-- LEFT -->
          <div class="header-left">
            <div class="header-icon">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                <path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5" />
              </svg>
              <!-- <img
                width="30"
                height="30"
                viewBox="0 0 35 35"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                src="go_gaming.png"
                alt="/"
              /> -->
            </div>

            <div>
              <h1>Dashboard Akademik</h1>
              <p class="subtitle">Aan Ansen Andryadi, S.Kom.,M.Kom</p>
            </div>
          </div>

          <!-- RIGHT (FIXED) -->
          <div class="header-right">
            <div class="header-date" id="headerDate"></div>

            <div
              class="theme-toggle single"
              id="themeToggle"
              title="Ganti Tema"
            >
              <span class="toggle-icon" id="themeIcon">🌙</span>
            </div>
          </div>
        </div>
      </header>

      <main>
        <!-- STATISTIK -->
        <section class="stats-grid" id="statsGrid"></section>

        <!-- KONTROL -->
        <section class="controls" id="controlsSection">
          <div class="search-box">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Cari nama atau NIM mahasiswa..."
              aria-label="Cari mahasiswa"
            />
          </div>
          <div class="controls-right">
            <select id="sortSelect" aria-label="Urutkan data">
              <option value="nama-asc">Nama A-Z</option>
              <option value="nama-desc">Nama Z-A</option>
              <option value="ipk-desc">IPK Tertinggi</option>
              <option value="ipk-asc">IPK Terendah</option>
            </select>
            <button
              class="btn btn-accent"
              id="addStudentBtn"
              aria-label="Tambah mahasiswa baru"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Tambah Mahasiswa
            </button>
          </div>
        </section>

        <!-- DAFTAR MAHASISWA -->
        <section id="listView" class="student-grid"></section>

        <!-- DETAIL MAHASISWA -->
        <section id="detailView" style="display: none"></section>
      </main>

      <!-- footer -->
      <footer class="app-footer">
        <div class="footer-left">
          <strong>Dashboard Akademik</strong>
          <span>© 2026</span>
        </div>

        <div class="footer-center">
          <strong>BY DOCKER.IO</strong>
        </div>

        <div class="footer-right">
          <a href="#">Bantuan</a>
          <a href="#">Kebijakan Privasi</a>
          <a href="#">Kontak</a>
        </div>
      </footer>
    </div>

    <!-- MODAL -->
    <div
      id="modalOverlay"
      class="modal-overlay"
      style="display: none"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modalContent"></div>
    </div>

    <!-- TOAST -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
